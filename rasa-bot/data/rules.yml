version: "3.1"

rules:

- rule: Use LLM response for fallback
  steps:
  - intent: nlu_fallback
  - action: action_llm_response

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Handle anxiety with LLM response
  steps:
  - intent: anxiety
  - action: action_llm_response

- rule: Handle stress with LLM response
